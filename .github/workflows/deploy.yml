name: Deploy
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy dist via SFTP
        run: |
          lftp -c "
            set sftp:connect-program 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.FTP_PORT }}';
            open sftp://${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }};
            mirror --reverse --delete --verbose dist/ /domains/clemdegdev.fr/public_html/;
          "
